      ending: "获得文化自觉"

    avoid:
      - "过度学术化"
      - "失去大众共鸣"

    conversion_fit:
      best_for: ["文化内容", "教育服务", "文化社群"]
      cta_style: "文化深度 + 内容推荐"

  - id: social_observation
