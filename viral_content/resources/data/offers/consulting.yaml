# v4.0 - AI咨询师的完整服务配置

offer:
  # ==================== 基本信息 ====================
  name: "企业AI落地咨询服务"
  type: "consulting"
  category: "AI咨询/数字化转型"

  # ==================== 价格阶梯 ====================
  pricing:
    free: "免费AI效率诊断（价值999元）"
    low_ticket: "AI工具实战课程 ¥299"
    mid_ticket: "企业AI落地咨询 ¥9,999起"
    high_ticket: "年度AI转型顾问 ¥50,000起"

  # ==================== 核心卖点 ====================
  unique_value_proposition:
    - "实战导向：不讲概念，只讲怎么用，30+真实案例验证"
    - "行业适配：针对不同行业定制方案，不是通用模板"
    - "落地陪跑：从诊断到实施全程陪跑，确保真正用起来"
    - "效果可见：3个月内可见效率提升50%以上"
    - "持续支持：提供1年免费答疑和更新"

  # ==================== 成交门槛 ====================
  commitment_required:
    time_investment: "前期诊断1天，实施周期1-3个月"
    skill_level: "无需技术背景，会基本电脑操作即可"
    tools_needed: "电脑+网络，AI工具由我们推荐"
    financial_commitment: "根据企业规模定制，起价9999元"

  # ==================== 目标客户匹配 ====================
  ideal_customer_profile:
    - "年营收100万-5000万的中小企业"
    - "有明确降本增效需求的企业主"
    - "尝试过AI但效果不佳的企业"
    - "想要数字化转型但不知道从何开始"
    - "电商、教育、餐饮、制造业等行业"

  # ==================== 转化路径 ====================
  conversion_path:
    step1:
      action: "评论「AI诊断」"
      keyword: "AI诊断"
      next_step: "自动发送《企业AI效率自测表》"

    step2:
      action: "加微信发送自测结果"
      incentive: "免费一对一诊断（价值999元）"
      next_step: "微信语音诊断30分钟"

    step3:
      action: "购买AI工具实战课程"
      product: "299元实战课程"
      next_step: "课程学员可升级咨询服务立减1000元"

    step4:
      action: "购买企业落地咨询"
      service: "9999元起企业AI落地咨询"
      next_step: "签约后3个月内完成实施"

  # ==================== 信任背书 ====================
  social_proof:
    testimonials:
      - "「王总（电商）：AI客服帮我们节省了3个人力成本，响应速度还更快了」"
      - "「李经理（教育机构）：AI内容工具让我们的内容产出提升了5倍」"
      - "「张总（餐饮）：AI营销方案让我们的获客成本降低了60%」"

    case_studies:
      - "案例1：某电商公司，AI客服系统上线后，人力成本月省2万，响应速度提升80%"
      - "案例2：某教育机构，AI内容工具赋能后，周产出从10篇提升到50篇，获客提升3倍"
      - "案例3：某餐饮连锁，AI营销方案实施2个月，新客获取成本降低60%"

    client_logos:
