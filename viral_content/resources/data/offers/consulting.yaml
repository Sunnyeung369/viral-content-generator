  risk_reversal:
    guarantee: "3个月内效率提升达不到30%，全额退款"
    support: "1年免费答疑+工具更新通知"
    refund_policy: "实施后1个月内不满意，无理由退款80%"

  # ==================== 咨询流程 ====================
  consulting_process:
    phase1:
      name: "诊断阶段（1-2天）"
      deliverables: ["企业AI效率诊断报告", "AI应用机会清单", "实施优先级建议"]

    phase2:
      name: "方案设计（3-5天）"
      deliverables: ["定制化AI落地方案", "工具选型建议", "实施计划表"]

    phase3:
      name: "实施陪跑（1-3个月）"
      deliverables: ["工具部署", "团队培训", "效果跟踪", "持续优化"]

    phase4:
      name: "验收与支持（持续）"
      deliverables: ["效果验收报告", "1年免费答疑", "工具更新通知"]

