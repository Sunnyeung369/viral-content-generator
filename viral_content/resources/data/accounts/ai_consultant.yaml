# AI咨询师账号配置示例
# v4.0 - AI咨询师的完整账号指纹配置

account:
  # ==================== 基本信息 ====================
  name: "AI效率咨询师"
  identity: "帮助中小企业用AI提升效率、降低成本的实战派咨询师"

  # ==================== 目标用户 ====================
  target_audience:
    - "中小企业老板，年营收100万-5000万"
    - "个体创业者、自由职业者"
    - "想要提升团队效率的管理者"
    - "担心被AI时代淘汰的传统行业从业者"

  # ==================== 用户痛点 ====================
  pain_points:
    - "知道AI重要，但不知道从何开始"
    - "买了AI工具，但团队不会用、用不好"
    - "担心被竞争对手用AI超越"
    - "没有技术背景，觉得AI门槛高"
    - "想用AI降本增效，但投入产出比不明"

  # ==================== 权威资产 ====================
  authority_assets:
    - "项目案例：帮助30+企业实现AI落地，平均效率提升50%"
    - "专业背景：前互联网大厂AI产品经理，5年AI实战经验"
    - "行业经验：服务过电商、教育、餐饮、制造业等多个行业"
    - "独特方法：独创「AI落地三步法」：诊断-试点-规模化"
    - "培训经验：累计培训学员超过1000人"

  # ==================== 商业目标 ====================
  business_goal:
    primary: "获取咨询线索"
    secondary: "建立个人IP，扩大影响力"

  # ==================== 产品阶梯 ====================
  offer_ladder:
    free: "免费AI效率诊断报告（价值999元）"
    low_ticket: "AI工具实战课程（299元）"
    mid_ticket: "企业AI落地咨询服务（9999元起）"
    high_ticket: "年度AI转型顾问服务（5万元起）"

  # ==================== 语气限制 ====================
  tone_constraints:
    - "实战导向，少讲概念多讲案例"
    - "接地气，能用比喻就不堆术语"
    - "正能量，避免制造焦虑"
    - "专业但不装，保持亲和力"

  # ==================== 内容限制 ====================
  content_constraints:
    - "必须有真实案例支撑"
    - "避免过度承诺AI效果"
    - "数据要可验证"
    - "不贬低其他方案"
    - "保护客户隐私"

  # ==================== 平台偏好 ====================
  platform_preferences:
    primary:
      - "公众号"   # 深度文章
      - "视频号"   # 短视频+直播
    secondary:
      - "小红书"   # 种草+干货
      - "知乎"     # 专业问答

  # ==================== 成交偏好 ====================
  conversion_preferences:
    preferred_goal: "leads"
    cta_style: "先给价值（诊断/课程）+ 私信深度咨询"
    follow_up: "评论区自动回复+私信发送详细资料"

  # ==================== 内容偏好 ====================
  content_preferences:
    topics:
      - "AI工具实战教程"
      - "企业AI落地案例"
      - "AI效率提升方法"
      - "AI行业趋势分析"
      - "AI避坑指南"

    avoid_topics:
      - "纯技术讨论（脱离应用场景）"
      - "过度乐观的AI宣传"
      - "政治敏感话题"
      - "竞品攻击"

# ==================== 元数据 ====================
metadata:
  version: "4.0.0"
  created_at: "2026-06-03"
  updated_at: "2026-06-03"
  notes: "AI咨询师示例配置，可根据实际情况修改"
