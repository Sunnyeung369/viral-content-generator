# 产品服务配置模板
# v4.0 - 支持成交目标和转化路径
#
# 使用说明：
# 1. 复制此文件并重命名
# 2. 填写你的产品服务信息
# 3. 使用 --offer 参数指定文件路径

offer:
  # ==================== 基本信息 ====================
  name: "示例产品/服务"
  type: "consulting"  # consulting（咨询）, course（课程）, product（产品）, service（服务）
  category: "具体分类"

  # ==================== 价格阶梯 ====================
  pricing:
    free: "$0 - 描述免费内容"
    low_ticket: "$99 - 描述低价产品"
    mid_ticket: "$1999 - 描述中价产品"
    high_ticket: "$30000 - 描述高价服务"

  # ==================== 核心卖点 ====================
  unique_value_proposition:
    - "卖点1：解决什么核心问题（差异化）"
    - "卖点2：为什么选择你而非竞品"
    - "卖点3：为什么现在要购买（紧迫感）"

  # ==================== 成交门槛 ====================
  commitment_required:
    time_investment: "需要投入的时间（如：每周5小时）"
    skill_level: "所需技能水平（如：无需编程基础）"
    tools_needed: "所需工具（如：一台电脑）"
    financial_commitment: "资金投入说明"

  # ==================== 目标客户匹配 ====================
  ideal_customer_profile:
    - "目标客户1：具体画像描述"
    - "目标客户2：具体画像描述"
    - "示例：年营收100万-5000万的中小企业老板"

  # ==================== 转化路径 ====================
  conversion_path:
    step1:
      action: "评论关键词"
      keyword: "相关关键词"
      next_step: "自动发送资料包"

    step2:
      action: "加微信/关注"
      incentive: "免费诊断/资料"
      next_step: "一对一咨询"

    step3:
      action: "购买低价产品"
      product: "具体低价产品名"
      next_step: "升级咨询/高价服务"

    step4:
      action: "购买高价服务"
      service: "具体高价服务名"

  # ==================== 信任背书 ====================
  social_proof:
    testimonials:
      - "客户评价1：具体描述和效果数据"
      - "客户评价2：具体描述和效果数据"

    case_studies:
      - "案例1：客户背景 + 问题 + 方案 + 结果"
      - "案例2：客户背景 + 问题 + 方案 + 结果"

    client_logos:
      - "客户1：品牌名/公司名"
      - "客户2：品牌名/公司名"

    metrics:
      - "数据1：服务客户数/成功率"
      - "数据2：平均效果/客户满意度"

  # ==================== 风险承诺 ====================
  risk_reversal:
    guarantee: "承诺说明（如：7天无理由退款）"
    support: "售后支持说明"
    refund_policy: "退款政策"

# ==================== 元数据 ====================
metadata:
  version: "4.0.0"
  created_at: "2026-06-03"
  updated_at: "2026-06-03"
  notes: "这是产品服务配置模板，复制后根据实际情况修改"
