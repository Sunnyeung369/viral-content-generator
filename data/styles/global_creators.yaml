# 全球创作者风格基因库 - 40个风格
# Viral Content Generator v4.0
# 每个风格描述的是可观察的风格特征，非具体创作者复刻

styles:
  # ==============================================================================
  # 科技/商业/创业类（15个）
  # ==============================================================================

  - id: tech_explainer_global
    label: "科技解释型创作者"
    category: "tech_creator"
    region: "global"
    reference_level: "publicly observable style traits only"

    style_dna:
      tone: "清晰、兴奋、未来感、强类比"
      sentence_rhythm: "短句开场，中句解释，结尾升维"
      vocabulary: "科技词汇 + 日常类比"
      emoji_usage: "少量（每100字1-2个）"

    hook_patterns:
      - "一个新技术正在改变普通人的工作方式"
      - "多数人只看到工具，高手已经在重构流程"
      - "这可能是近年来最重要的技术趋势"

    logic_patterns:
      - "现象 -> 案例 -> 机制 -> 商业机会"
      - "旧方法低效 -> 新工具放大 -> 个体套利窗口"

    emotion_curve:
      opening: "惊讶"
      middle: "恍然大悟"
      ending: "立刻想行动"

    avoid:
      - "直接复刻具体创作者口头禅"
      - "使用特定个人专属表达"

    conversion_fit:
      best_for:
        - "AI工具推广"
        - "咨询服务获客"
        - "课程转化"
      cta_style: "行动召唤 + 具体步骤"

  - id: business_podcast_host
    label: "商业播客主持人"
    category: "podcast_host"
    region: "global"

    style_dna:
      tone: "对话式、好奇、深入、不评判"
      sentence_rhythm: "提问停顿，倾听回应，追问深挖"
      conversation_flow: "闲聊开场 -> 核心问题 -> 深度探讨 -> 行动建议"

    hook_patterns:
      - "我今天特别想聊的话题是..."
      - "这让我想起了一个故事..."
      - "你怎么看这个问题？"

    logic_patterns:
      - "开场寒暄 -> 切入正题 -> 深度追问 -> 总结升华"

    emotion_curve:
      opening: "轻松"
      middle: "投入"
      ending: "启发"

    avoid:
      - "打断嘉宾"
      - "过于强烈的个人观点"

    conversion_fit:
      best_for:
        - "播客内容"
        - "访谈节目"
        - "知识分享"
      cta_style: "邀请订阅 + 下期预告"

  - id: startup_founder_vlogger
    label: "创业公司Vlog博主"
    category: "startup_creator"
    region: "global"

    style_dna:
      tone: "真实、透明、起伏不定、成长记录"
      sentence_rhythm: "日常叙述 + 关键时刻强调"
      content_focus: "创业日常、团队会议、产品迭代"

    hook_patterns:
      - "今天是个大日子..."
      - "这可能是个错误，但..."
      - "创业第X天，我终于..."

    logic_patterns:
      - "日常场景 -> 问题出现 -> 解决过程 -> 反思总结"

    emotion_curve:
      opening: "日常"
      middle: "起伏"
      ending: "真实/希望"

    avoid:
      - "过度美化失败"
      - "隐藏真实困难"

    conversion_fit:
      best_for:
        - "创业故事"
        - "团队展示"
        - "产品发布"
      cta_style: "关注创业旅程 + 加入社区"

  - id: tech_reviewer_deep
    label: "深度科技测评"
    category: "tech_creator"
    region: "global"

    style_dna:
      tone: "客观、专业、数据驱动、对比分析"
      sentence_rhythm: "概述 -> 详细测试 -> 数据分析 -> 结论"
      review_focus: "真实使用、优缺点、替代品对比"

    hook_patterns:
      - "我用了X周，终于可以说..."
      - "这是最好的...吗？可能不是"
      - "在购买之前，你需要知道..."

    logic_patterns:
      - "产品介绍 -> 实测数据 -> 竞品对比 -> 购买建议"

    emotion_curve:
      opening: "好奇"
      middle: "理性"
      ending: "明确结论"

    avoid:
      - "收厂商好处"
      - "隐瞒明显缺陷"

    conversion_fit:
      best_for:
        - "科技测评"
        - "购买指南"
        - "产品推荐"
      cta_style: "链接 + 折扣码"

  - id: business_analyst_data
    label: "数据驱动商业分析师"
    category: "business_creator"
    region: "global"

    style_dna:
      tone: "严谨、数据化、趋势导向、预测性"
      sentence_rhythm: "数据呈现 -> 趋势分析 -> 战略建议"
      analysis_tools: "图表、统计数据、行业报告"

    hook_patterns:
      - "数据显示了一个清晰的信号..."
      - "过去6个月的趋势告诉我们..."
      - "这不是猜测，这是数据说话..."

    logic_patterns:
      - "数据收集 -> 趋势识别 -> 因果分析 -> 行动建议"

    emotion_curve:
      opening: "数据冲击"
      middle: "理性分析"
      ending: "战略方向"

    avoid:
      - "主观臆断"
      - "选择性呈现数据"

    conversion_fit:
      best_for:
        - "行业分析"
        - "趋势报告"
        - "战略咨询"
      cta_style: "订阅报告 + 咨询服务"

  - id: vc_investor_perspective
    label: "VC投资人视角"
    category: "business_creator"
    region: "global"

    style_dna:
      tone: "投资视角、市场判断、规模思维、退出导向"
      sentence_rhythm: "市场机会 -> 商业模式 -> 增长潜力 -> 投资决策"
      focus: "商业模式、增长策略、团队、退出"

    hook_patterns:
      - "我见过几百个项目，这是唯一..."
      - "这个赛道太小了，但..."
      - "作为投资人，我最看重的是..."

    logic_patterns:
      - "市场分析 -> 商业模式评估 -> 团队判断 -> 投资建议"

    emotion_curve:
      opening: "犀利"
      middle: "分析"
      ending: "投资判断"

    avoid:
      - "过于乐观"
      - "忽略风险"

    conversion_fit:
      best_for:
        - "创业建议"
        - "融资准备"
        - "商业计划"
      cta_style: "关注 + 商业计划书投递"

  - id: product_manager_insights
    label: "产品经理洞见"
    category: "tech_creator"
    region: "global"

    style_dna:
      tone: "用户中心、数据驱动、迭代思维、优先级"
      sentence_rhythm: "用户问题 -> 解决方案 -> 迭代过程"
      frameworks: "用户故事、A/B测试、MVP"

    hook_patterns:
      - "用户真正需要的不是..."
      - "我们测试了100个变体，发现..."
      - "这个功能的决定性指标是..."

    logic_patterns:
      - "用户问题 -> 假设 -> 实验 -> 数据 -> 迭代"

    emotion_curve:
      opening: "用户痛点"
      middle: "解决问题"
      ending: "数据洞察"

    avoid:
      - "功能堆砌"
      - "忽视数据"

    conversion_fit:
      best_for:
        - "产品教程"
        - "UX设计"
        - "增长策略"
      cta_style: "工具推荐 + 模板分享"

  - id: saas_founder_storytelling
    label: "SaaS创始人故事讲述"
    category: "startup_creator"
    region: "global"

    style_dna:
      tone: "创业叙事、指标透明、增长黑客、订阅经济"
      sentence_rhythm: "问题发现 -> 产品构建 -> 增长过程"
      metrics: "MRR、Churn、CAC、LTV"

    hook_patterns:
      - "从0到$X MRR，我们用了X个月"
      - "差点倒闭的那一天，我决定..."
      - "订阅制生意的秘密是..."

    logic_patterns:
      - "发现问题 -> 构建MVP -> 获取首批用户 -> 规模化增长"

    emotion_curve:
      opening: "创业低谷"
      middle: "突破"
      ending: "增长启发"

    avoid:
      - "粉饰数据"
      - "隐藏失败"

    conversion_fit:
      best_for:
        - "SaaS创业"
        - "订阅业务"
        - "B2B营销"
      cta_style: "免费试用 + 社区加入"

  - id: crypto_analyst_technical
    label: "加密技术分析"
    category: "tech_creator"
    region: "global"

    style_dna:
      tone: "技术深度、链上分析、风险评估、长期视角"
      sentence_rhythm: "技术分析 -> 市场情绪 -> 投资策略"
      analysis: "链上数据、DeFi指标、NFT稀有度"

    hook_patterns:
      - "链上数据显示..."
      - "这个指标意味着..."
      - "大多数人没注意到的是..."

    logic_patterns:
      - "技术分析 -> 基本面评估 -> 风险提示 -> 投资建议"

    emotion_curve:
      opening: "数据冲击"
      middle: "深度分析"
      ending: "理性判断"

    avoid:
      - "财务建议"
      - "保证收益"

    conversion_fit:
      best_for:
        - "加密分析"
        - "DeFi教程"
        - "NFT评估"
      cta_style: "关注分析 + 链接工具"

  - id: futurism_trend_watcher
    label: "未来趋势观察"
    category: "tech_creator"
    region: "global"

    style_dna:
      tone: "前瞻性、跨学科、模式识别、10年视角"
      sentence_rhythm: "当下信号 -> 趋势外推 -> 未来场景"
      methods: "信号收集、模式匹配、情景规划"

    hook_patterns:
      - "5年后，X将变得..."
      - "这些看似不相关的信号指向..."
      - "我追踪了3年，这个趋势终于..."

    logic_patterns:
      - "弱信号识别 -> 模式匹配 -> 趋势验证 -> 未来推演"

    emotion_curve:
      opening: "好奇"
      middle: "洞察"
      ending: "未来想象"

    avoid:
      - "确定预测"
      - "单一视角"

    conversion_fit:
      best_for:
        - "趋势分析"
        - "战略规划"
        - "创新思维"
      cta_style: "订阅趋势报告 + 工作坊"

  - id: productivity_hacker
    label: "效率黑客"
    category: "lifestyle_creator"
    region: "global"

    style_dna:
      tone: "实用、工具密集、流程优化、时间管理"
      sentence_rhythm: "痛点 -> 工具 -> 工作流"
      focus: "软件工具、自动化、快捷键"

    hook_patterns:
      - "这个工具让我每天节省2小时"
      - "99%的人都没有发现的效率技巧..."
      - "如果你还在这样做，你是在浪费时间..."

    logic_patterns:
      - "效率问题 -> 传统方法 -> 更好工具 -> 新工作流"

    emotion_curve:
      opening: "痛点共鸣"
      middle: "解决方案"
      ending: "效率提升"

    avoid:
      - "过度复杂"
      - "工具堆砌"

    conversion_fit:
      best_for:
        - "工具推荐"
        - "效率教程"
        - "工作流分享"
      cta_style: "工具链接 + 工作流模板"

  - id: indie_maker_journal
    label: "独立开发者日记"
