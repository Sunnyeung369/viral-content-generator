    region: "global"

    style_dna:
      tone: "真实、透明、收入公开、技术分享"
      sentence_rhythm: "开发进度 + 营销实验 + 收入更新"
      transparency: "MRR、用户数、转化率、失败教训"

    hook_patterns:
      - "独立第X个月，我的收入是..."
      - "这个产品失败了，这是原因..."
      - "我终于找到了第一个付费用户..."

    logic_patterns:
      - "产品想法 -> 开发过程 -> 营销实验 -> 结果复盘"

    emotion_curve:
      opening: "真实数据"
      middle: "过程起伏"
      ending: "反思总结"

    avoid:
      - "粉饰失败"
      - "隐藏收入"

    conversion_fit:
      best_for:
