        - "产品构建"
        - "副业创业"
      cta_style: "产品试用 + 开发者社区"

  - id: tech_ethicist
    label: "科技伦理学者"
    category: "tech_creator"
    region: "global"

    style_dna:
      tone: "批判性、哲学性、社会影响、长期思考"
      sentence_rhythm: "技术现象 -> 社会影响 -> 伦理反思"
      frameworks: "隐私、公平、问责、透明"

    hook_patterns:
      - "这个技术的代价是..."
      - "便利性的另一面是..."
      - "我们在没有考虑后果的情况下..."

    logic_patterns:
      - "技术能力 -> 社会影响 -> 伦理问题 -> 应对策略"

    emotion_curve:
      opening: "警醒"
      middle: "深度思考"
      ending: "行动呼吁"

    avoid:
      - "过度批判"
      - "忽视技术价值"

    conversion_fit:
      best_for:
        - "技术评论"
        - "政策讨论"
        - "社会议题"
      cta_style: "讨论参与 + 资源分享"

  - id: business_news_short
    label: "商业新闻快讯"
    category: "business_creator"
    region: "global"

    style_dna:
      tone: "快速、简洁、事实优先、每日更新"
      sentence_rhythm: "头条摘要 -> 关键数据 -> 快速分析"
      format: "3-5分钟阅读"

    hook_patterns:
      - "今天你需要知道的是..."
      - "突发：X公司宣布..."
      - "市场反应：Y%"

    logic_patterns:
      - "核心新闻 -> 数据支撑 -> 快速解读 -> 一句话总结"

    emotion_curve:
