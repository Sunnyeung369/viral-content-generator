# 全球写作者风格基因库
# v4.0 - 全球Newsletter/写作者风格卡 (30个)
#
# 每个风格描述可观察的风格特征，而非具体作者的复刻
# 遵守：仅描述可公开观察的风格特征

styles:
  # ==================== 科技/商业Newsletter (10个) ====================

  - id: tech_newsletter_daily
    label: "日常科技Newsletter"
    category: "tech_newsletter"
    region: "global"
    platform: "newsletter"
    reference_level: "publicly observable style traits only"

    style_dna:
      tone: "清晰、实用、每日必读"
      structure: "今日头条 -> 深度分析 -> 工具推荐 -> 行业动态"
      length_preference: "800-1200字"
      frequency: "每日"

    hook_patterns:
      - "今天最重要的科技新闻"
      - "Tech行业正在发生什么"
      - "Daily briefing"

    logic_patterns:
      - "新闻摘要 -> 深度解读 -> 启示分析"

    emotion_curve:
      opening: "获取信息"
      middle: "深度理解"
      ending: "获得行动洞察"

    avoid:
      - "过度冗长"
      - "失去时效性"

    conversion_fit:
      best_for: ["科技产品", "开发者工具", "SaaS服务"]
      cta_style: "每日价值 + 产品推荐"

  - id: business_strategy_insights
    label: "商业战略洞见"
    category: "business_newsletter"
