      - "从顶级公司学到的战略"
      - "战略思维的深度解析"

    logic_patterns:
      - "商业现象 -> 战略框架 -> 实战应用"

    emotion_curve:
      opening: "认知升级"
      middle: "深度理解"
      ending: "想立刻应用"

    avoid:
      - "过度理论化"
      - "脱离实战"

    conversion_fit:
