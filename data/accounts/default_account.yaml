# 账号指纹配置模板
# v4.0 - 支持账号定位和成交目标
#
# 使用说明：
# 1. 复制此文件并重命名
# 2. 填写你的账号信息
# 3. 使用 --account 参数指定文件路径

account:
  # ==================== 基本信息 ====================
  name: "示例账号"  # 账号名称
  identity: "你的专业定位（一句话说明你是谁）"  # 一句话定位

  # ==================== 目标用户 ====================
  target_audience:
    - "目标用户群体1：具体描述"
    - "目标用户群体2：具体描述"
    - "示例：中小企业老板，年营收100万-5000万"

  # ==================== 用户痛点 ====================
  pain_points:
    - "痛点1：用户当前面临的具体问题"
    - "痛点2：用户的焦虑和困惑"
    - "示例：不知道如何用AI提升效率，担心被竞争对手超越"

  # ==================== 权威资产 ====================
  authority_assets:
    - "项目案例：具体的成功案例和数据"
    - "专业认证：你的资质和证书"
    - "行业经验：从业年限和成就"
    - "独特方法：你的独创方法论"

  # ==================== 商业目标 ====================
  business_goal:
    primary: "获取咨询线索"  # 主要目标：获取咨询线索、引导私域、直接销售
    secondary: "引导私域"     # 次要目标

  # ==================== 产品阶梯 ====================
  offer_ladder:
    free: "免费诱饵（如：AI效率自测表）"
    low_ticket: "低价产品（99-299元）"
    mid_ticket: "中价产品（1999-4999元）"
    high_ticket: "高价服务（3万-30万）"

  # ==================== 语气限制 ====================
  tone_constraints:
    - "专业但不失亲和"
    - "有干货但不枯燥"
    - "能说人话，避免过度专业术语"

  # ==================== 内容限制 ====================
  content_constraints:
    - "避免过度承诺"
    - "数据要有来源"
    - "案例要真实可验证"

  # ==================== 平台偏好 ====================
  platform_preferences:
    primary:
      - "公众号"   # 主要运营平台
      - "视频号"
    secondary:
      - "小红书"   # 次要分发平台
      - "知乎"

  # ==================== 成交偏好 ====================
  conversion_preferences:
    preferred_goal: "leads"  # likes, comments, leads, sales
    cta_style: "价值先行 + 私信咨询"
    follow_up: "自动发送资料包"

# ==================== 元数据 ====================
metadata:
  version: "4.0.0"
  created_at: "2026-06-03"
  updated_at: "2026-06-03"
  notes: "这是账号配置模板，复制后根据实际情况修改"
