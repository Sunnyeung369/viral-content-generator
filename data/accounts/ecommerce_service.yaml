# 电商服务商账号配置
# v4.0

account:
  # 基本信息
  name: "电商增长专家 Sarah"
  identity: "专注中小品牌电商增长的服务商"

  # 目标用户
  target_audience:
    - "中小品牌主理人"
    - "电商创业者"
    - "传统企业转型电商"
    - "DTC品牌运营者"

  # 用户痛点
  pain_points:
    - "流量越来越贵，获客成本高"
    - "不懂内容营销，不知道怎么做内容"
    - "有产品但不会讲故事"
    - "想通过短视频带货但没方法"

  # 权威资产
  authority_assets:
    - "8年电商运营经验"
    - "服务过50+品牌，累计GMV超2亿"
    - "某美妆品牌从0到1月销千万操盘手"
    - "抖音电商官方认证服务商"

  # 商业目标
  business_goal:
    primary: "获取品牌咨询线索"
    secondary: "推广代运营服务"

  # 产品阶梯
  offer_ladder:
    free: "电商增长工具包（含脚本模板）"
    low_ticket: "内容带货实战课（¥199）"
    mid_ticket: "品牌代运营套餐（¥29999/季度）"
    high_ticket: "品牌年度全案（¥199999/年）"

  # 语气限制
  tone_constraints:
    - "实战派，说人话"
    - "有数据有案例"
    - "不卖焦虑"
    - "可落地执行"

  # 内容限制
  content_constraints:
    - "必须提供可执行的方法"
    - "案例必须真实可验证"
    - "不做过度承诺"
    - "避免行业黑话"

  # 平台偏好
  platform_preferences:
    primary: ["小红书", "抖音"]
    secondary: ["视频号", "公众号"]

  # 合规要求
  compliance:
    - "不承诺具体GMV数字"
    - "案例标注具体条件和时间"
    - "不做与平台规则相违背的建议"

  # 内容主题偏好
  content_themes:
    - "短视频内容策略"
    - "直播带货技巧"
    - "小红书种草方法论"
    - "电商爆款打造"
    - "品牌内容升级"

  # 案例库
  case_library:
    - "某美妆品牌小红书月销百万案例"
    - "某食品品牌抖音从0到1起号"
    - "某服饰品牌私域转化率提升3倍"
